# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Build and test on push or pull-request

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        build_type: [ Release ]
        c_compiler: [ clang, cl ]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: cl

    steps:
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install build-essential git make \
            pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
            libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      #- name: Cache build
        #uses: actions/cache@v5
        #with:
          #path: build
          #key: ${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'extern/**') }}

      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Build
        # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: ctest --build-config ${{ matrix.build_type }}

        # Packaging
      - name: 'Create dist folders (Linux)'
        if: runner.os == 'Linux'
        run: | 
            mkdir package
            cp "${{steps.strings.outputs.build-output-dir}}/SDL_PRO_GEN" package/
            cp "${{steps.strings.outputs.build-output-dir}}/extern/graphics-lib/extern/SDL_shadercross/external/DirectXShaderCompiler/lib/libdxcompiler.so" package/ 
            cp -r assets package/
            cp -r extern/graphics-lib/shaders package/
            cp -r data package/
            cp LICENSE package/ || true
            cp README.md package/ || true
            cp -r OTHER_LICENSES package/ || true
          
            cd package
            zip -r ../Rate-linux.zip .
      - name: 'Create dist folders (Windows)'
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item "${{ steps.strings.outputs.build-output-dir }}\Release\SDL_PRO_GEN.exe" package
          Copy-Item extern\graphics-lib\libs\dxcompiler.dll package
          Copy-Item assets package -Recurse
          Copy-Item extern/graphics-lib/shaders package -Recurse
          Copy-Item data package -Recurse
          
          Copy-Item LICENSE package -ErrorAction SilentlyContinue
          Copy-Item README.md package -ErrorAction SilentlyContinue
          Copy-Item OTHER_LICENSES package -Recurse -ErrorAction SilentlyContinue
          
          Compress-Archive -Path package\* -DestinationPath Rate-windows.zip -Force
      - name: 'Create dist folders (MacOs)'
        if: runner.os == 'macOs'
        run: |
          mkdir package
          cp "${{steps.strings.outputs.build-output-dir}}/SDL_PRO_GEN" package/
          cp -r assets package/
          cp -r extern/graphics-lib/shaders package/
          cp -r data package/
          cp LICENSE package/ || true
          cp README.md package/ || true
          cp -r OTHER_LICENSES package/ || true
          
          cd package
          zip -r ../Rate-macos.zip .

      # Upload artifacts
      - name: 'Upload Artifact (Linux)'
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Rate-linux
          path: Rate-linux.zip
      - name: 'Upload Artifact (Windows)'
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Rate-windows
          path: Rate-windows.zip
      - name: 'Upload Artifact (MacOs)'
        if: runner.os == 'macOs'
        uses: actions/upload-artifact@v4
        with:
          name: Rate-macos
          path: Rate-macos.zip
          
          
  build-web: 
    runs-on: ubuntu_latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
            
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure
        run: emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j
          - 
        # Packaging
      - name: Create dist folder
        run: |
           mkdir package
           
           cp build/SDL_PRO_GEN.html package/
           cp build/SDL_PRO_GEN.wasm package/
           cp build/SDL_PRO_GEN.js package/
           cp build/SDL_PRO_GEN.data package/
           cp LICENSE package/ || true
           cp README.md package/ || true
           cp -r OTHER_LICENSES package/ || true
           
           cd package
           zip -r ../Rate-web.zip .
           
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: Rate-web
          path: Rate-web.zi
      
